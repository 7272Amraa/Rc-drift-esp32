name: Build ESP32-WROOM-DA OTA BIN

on:
  push:
    branches: [main]
    paths:
      - 'HelloWorldOTA.ino'
      - 'RC_Drift_TX_V6_AudioOTA_SINGLE.ino'
      - 'RC_Drift_TX_V6_COMPACT.ino'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and OLED libraries
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "Adafruit BusIO" "Adafruit GFX Library" "Adafruit SSD1306"
      - name: Choose compact TX first for smaller OTA partition
        shell: bash
        run: |
          if test -f RC_Drift_TX_V6_COMPACT.ino; then
            mkdir -p sketch/RC_Drift_TX_V6_COMPACT
            cp RC_Drift_TX_V6_COMPACT.ino sketch/RC_Drift_TX_V6_COMPACT/firmware_impl.h
            printf '#include "firmware_impl.h"\n' > sketch/RC_Drift_TX_V6_COMPACT/RC_Drift_TX_V6_COMPACT.ino
            echo "SKETCH=sketch/RC_Drift_TX_V6_COMPACT" >> "$GITHUB_ENV"
            echo "BIN=RC_Drift_TX_V6_COMPACT.ino.bin" >> "$GITHUB_ENV"
          elif test -f RC_Drift_TX_V6_AudioOTA_SINGLE.ino; then
            mkdir -p sketch/RC_Drift_TX_V6_AudioOTA
            cp RC_Drift_TX_V6_AudioOTA_SINGLE.ino sketch/RC_Drift_TX_V6_AudioOTA/firmware_impl.h
            printf '#include "firmware_impl.h"\n' > sketch/RC_Drift_TX_V6_AudioOTA/RC_Drift_TX_V6_AudioOTA.ino
            echo "SKETCH=sketch/RC_Drift_TX_V6_AudioOTA" >> "$GITHUB_ENV"
            echo "BIN=RC_Drift_TX_V6_AudioOTA.ino.bin" >> "$GITHUB_ENV"
          else
            mkdir -p sketch/HelloWorldOTA
            cp HelloWorldOTA.ino sketch/HelloWorldOTA/HelloWorldOTA.ino
            echo "SKETCH=sketch/HelloWorldOTA" >> "$GITHUB_ENV"
            echo "BIN=HelloWorldOTA.ino.bin" >> "$GITHUB_ENV"
          fi
      - name: Compile 4MB OTA firmware
        shell: bash
        run: |
          mkdir -p firmware
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:FlashSize=4M,PartitionScheme=min_spiffs \
            --output-dir firmware "$SKETCH"
          test -s "firmware/$BIN"
          ls -lh "firmware/$BIN"
          actual_size=$(stat -c %s "firmware/$BIN")
          echo "Firmware bytes: $actual_size"
          test "$actual_size" -le 1310720
      - name: Save OTA firmware ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-OTA-BIN
          path: firmware/*.ino.bin
          if-no-files-found: error
          retention-days: 30
